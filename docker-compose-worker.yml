services:
  ray-worker:
    build: .
    image: vllm-ray
    container_name: ray-worker
    entrypoint: /bin/bash
    command: -c "ray start --address=${HEAD_NODE_IP:-10.50.100.100}:6379 --node-ip-address=${WORKER_NODE_IP:-0.0.0.0} --block"
    network_mode: host
    ipc: host
    shm_size: "10.24g"
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /home/vectir/.cache/huggingface:/root/.cache/huggingface
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_HOST_IP=${WORKER_NODE_IP:-0.0.0.0}
      - NCCL_SOCKET_IFNAME=${NETWORK_INTERFACE:-eth0}
      - GLOO_SOCKET_IFNAME=${NETWORK_INTERFACE:-eth0}
      - NCCL_DEBUG=WARN
      - HF_TOKEN=${HF_TOKEN}
    restart: unless-stopped
